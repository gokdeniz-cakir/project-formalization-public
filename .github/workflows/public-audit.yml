name: Public repository audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit-publication.py
      - run: python scripts/test-model.py
      - run: python scripts/test-skills.py
      - run: python -m unittest discover -s skills/project-formalization/scripts/tests -p "test_*.py"
      - run: python -m unittest discover -s skills/project-formalization-raw/scripts/tests -p "test_*.py"
