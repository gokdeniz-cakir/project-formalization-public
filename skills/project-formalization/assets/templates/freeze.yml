schema_version: "1.2"
workflow:
  # Use production for prospective current-release work, agile for retrospective blindness.
  profile: "production"
  soft_time_limit_minutes: 90
  method_policy: "formal_required"
  critic_policy: "on_positive_finding"
freeze:
  confirmed: false
  confirmed_at: null
  confirmed_by: null
experiment:
  id: "project-component-mode-01"
  mode: "prospective"
  expected_verdict: null
project:
  name: "project"
  upstream_url: "https://example.invalid/project"
  version: "0.0.0"
  release_tag: "v0.0.0"
  commit: "0000000000000000000000000000000000000000"
  license: "SPDX-identifier-or-description"
source:
  archive_url: null
  archive_sha256: null
  signature_url: null
  signer_fingerprint: null
  provenance_note: null
  cache_key: "project-commit"
  verification_receipt: ".fvh-provenance.yml"
  acquisition_commands:
    powershell:
      - "Write-Error 'Replace with deterministic acquisition commands for this host'"
    posix: []
  scope_inventory:
    - path: "src/component.c"
      sha256: null
target:
  language: "c"
  component: "bounded C component"
  production_boundary: "Name the production entry points and state covered by claims."
  included_files:
    - "src/component.c"
  readable_dependencies: []
  excluded_claims: []
  safety_rationale: "Explain why the C target is formally tractable and replayable."
properties:
  - id: "valid-deref"
    kind: "memory-safety"
    statement: "Every production pointer dereference is valid within the declared boundary."
    formal_encoding: "CBMC pointer-check or equivalent property mapping"
tooling:
  formal:
    required: true
    name: "select-after-preflight"
    family: "bounded_model_checking"
    execution_environment: "wsl:Ubuntu"
    version_command: "cbmc --version"
    build_command: null
    analyze_command: null
    completeness_command: null
    property_mapping: "Map the backend property and assertion identifiers to the frozen property IDs."
    witness_format: "tool-native trace or SV-COMP-compatible witness"
    secondary:
      name: null
      family: null
      execution_environment: null
      version_command: null
      analyze_command: null
  runtime:
    oracle: "AddressSanitizer"
    version_command: null
    build_command: null
    witness_command: null
    control_command: null
    checker_sanity_command: null
agents:
  model: "exact-model-id"
  knowledge_cutoff: "YYYY-MM"
  reasoning_effort: "exact-effort"
  tool_environment: "C compiler, formal backend, solver, and WSL/native runner"
  framing: "positive_restricted_vs_neutral_open"
network:
  policy: "asymmetric"
  audit_required: true
  arm_policies:
    investigator_a: "target_restricted_audited"
    investigator_b: "open_unmonitored"
  forbidden_sources:
    - "sibling branches, worktrees, prompts, reviews, and results"
repository:
  destination: "C:/absolute/path/to/new-formal-harness"
  setup_shell: "powershell"
  remote_policy: "local_only"
  remote_url: null
  source_policy: "exact_commit"
  push_lock_required: false
baseline_files: []
